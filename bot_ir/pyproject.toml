[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "profmw"
version = "0.1.0"
description = "NPU profiling 数据中间件：带标签二维矩阵的存储、接入与聚合查询"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
viz = ["plotly>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
